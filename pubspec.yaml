version: 0.0.9
homepage: https://github.com/chatwoot/chatwoot-flutter-sdk

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  meta: any
  rxdart: ^0.28.0
  uuid: ^4.5.3
  cross_file: ^0.3.5+2
